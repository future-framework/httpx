# encode/httpx's test-suite.yml: tests (python-version 3.13, ubuntu-latest), for the Superaction scoreboard.
name: Superaction

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / superaction-fabric
    runs-on: superaction-fabric
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@v4"
        with:
          persist-credentials: false
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"
          allow-prereleases: true
      - name: "Install dependencies"
        run: "scripts/install"
      - name: "Run tests"
        run: "scripts/test"
      - name: "Enforce coverage"
        run: "scripts/coverage"
